name: sextafeira
description: "Um assistente virtual pessoal ."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  flutter_background_service: ^5.1.0
  android_intent_plus: ^5.1.0
  
  vosk_flutter: ^0.3.48
  permission_handler: ^11.3.1
  fluttertoast: ^10.0.0
  flutter_contacts: ^2.3.1
  installed_apps: ^2.1.1
  speech_to_text: ^7.4.0
  battery_plus: ^7.1.1
  torch_light: ^2.0.0
  audio_session: ^0.2.4
  flutter_volume_controller: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/vosk-model-small-pt.zip

dependency_overrides:
  permission_handler: ^11.3.1
  http: ^1.2.0
  